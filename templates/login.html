<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h3 {
            margin-bottom: 6px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
        }
        .login-card .sub {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }
        .login-card .form-control {
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
        }
        .login-card .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,.18);
        }
        .login-card button[type=submit] {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            letter-spacing: .5px;
            transition: transform .15s, box-shadow .15s;
        }
        .login-card button[type=submit]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,.45);
        }
        .err-msg {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13.5px;
            margin-bottom: 16px;
            text-align: center;
        }
        .logo-circle {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            color: #fff; font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-circle"><i class="fas fa-lock"></i></div>
        <h3>Đăng nhập</h3>
        <p class="sub">Nhập mật khẩu để truy cập hệ thống</p>
        {% if error %}<div class="err-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}
        <form method="POST" autocomplete="on">
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required autofocus>
            </div>
            <button type="submit"><i class="fas fa-sign-in-alt me-1"></i> ĐĂNG NHẬP</button>
        </form>
        <div class="text-center mt-3" style="font-size: 12px; color: #94a3b8;">
            Phiên đăng nhập sẽ được nhớ trong 365 ngày
        </div>
    </div>
</body>
</html>

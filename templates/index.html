<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý P2P</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-4 mb-5">
        <div class="main-nav-tabs">
            <a href="/market" id="navMarket" class="active"><i class="fas fa-chart-line"></i> THỊ TRƯỜNG P2P</a>
            <a href="/ads" id="navAds"><i class="fas fa-bullhorn"></i> QUẢNG CÁO</a>
            <a href="/orders" id="navOrders"><i class="fas fa-shopping-cart"></i> ĐƠN HÀNG</a>
        </div>
        {% include 'account_panel.html' %}
        {% include 'market_panel.html' %}
        {% include 'post_ad_panel.html' %}
        {% include 'orders_panel.html' ignore missing %}
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
      <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body fw-bold" id="toastMessage"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <!-- Modal Xác Nhận Hành Động -->
    <div class="modal fade" id="actionConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold text-dark" id="actionConfirmTitle">Xác nhận</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body pb-0" id="actionConfirmMsg" style="font-size: 15px;">Bạn có chắc chắn thực hiện không?</div>
          <div class="modal-footer border-top-0 pt-3">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy bỏ</button>
            <button type="button" class="btn btn-primary px-4 fw-bold" id="btnConfirmAction">Đồng ý</button>
          </div>
        </div>
      </div>
    </div>

<!-- Modal Sửa Quảng Cáo -->
<div class="modal fade" id="editAdModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          <i class="fas fa-edit text-primary"></i>
          Sửa Quảng Cáo <span id="editAdIdText" class="text-secondary"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>

      <div class="modal-body">
        
        <!-- MỚI: BẢNG GÁN TỰ ĐỘNG MIN MAX GIÁ CỦA MỐC -->
        <div class="alert alert-info py-2 px-3 d-flex justify-content-between align-items-center mb-3">
          <div class="fw-bold text-dark" style="font-size: 14px;">
            <i class="fas fa-tags text-primary"></i> Đang gán bám sát: <span id="editAdTierLabel" class="text-danger ms-1 fs-6">Mốc 1</span>
          </div>
          <button type="button" class="btn btn-sm btn-primary fw-bold" id="btnApplyTierData">
            <i class="fas fa-bolt"></i> Áp dụng Giá và Min/Max của Mốc
          </button>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Giá</label>
            <input type="number" class="form-control text-primary fw-bold" id="editAdPrice" step="0.01">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Số lượng USDT</label>
            <input type="number" class="form-control" id="editAdQuantity" step="0.000001">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Hạn mức thanh toán</label>
            <input type="number" class="form-control bg-light" id="editAdPaymentPeriod" value="15" disabled>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Min Fiat</label>
            <input type="number" class="form-control" id="editAdMin" step="0.01">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Max Fiat</label>
            <input type="number" class="form-control" id="editAdMax" step="0.01">
          </div>

          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold">Ghi chú quảng cáo</label>
            <textarea class="form-control" id="editAdRemark" rows="3"></textarea>
          </div>

          <div class="col-md-12 mt-2">
            <h6 class="fw-bold text-primary">
              <i class="fas fa-shield-alt"></i> Điều kiện khách hàng
            </h6>
          </div>

          <div class="col-md-12 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="editAdHasUnPostAd">
              <label class="form-check-label fw-bold text-dark" for="editAdHasUnPostAd">
                Không giao dịch với Nhà quảng cáo khác
              </label>
            </div>
          </div>

          <div class="col-md-4 mb-2">
            <label class="form-label mb-1 text-secondary">Số ngày đăng ký ≥</label>
            <select class="form-select form-select-sm" id="editAdRegisterTime">
              <option value="0">Không yêu cầu</option>
              <option value="15">15 ngày</option>
              <option value="30">30 ngày</option>
              <option value="90">90 ngày</option>
              <option value="180">180 ngày</option>
            </select>
          </div>

          <div class="col-md-4 mb-2">
            <label class="form-label mb-1 text-secondary">Số lệnh 30 ngày ≥</label>
            <select class="form-select form-select-sm" id="editAdOrderFinish">
              <option value="0">Không yêu cầu</option>
              <option value="5">5 lệnh</option>
              <option value="10">10 lệnh</option>
              <option value="40">40 lệnh</option>
              <option value="60">60 lệnh</option>
            </select>
          </div>

          <div class="col-md-4 mb-2">
            <label class="form-label mb-1 text-secondary">Tỷ lệ hoàn thành 30 ngày ≥</label>
            <select class="form-select form-select-sm" id="editAdCompleteRate">
              <option value="0">Không yêu cầu</option>
              <option value="50">50%</option>
              <option value="85">85%</option>
              <option value="90">90%</option>
              <option value="95">95%</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Đóng</button>
        <button type="button" class="btn btn-primary fw-bold px-4" id="btnSubmitEditAd">
          Lưu Thay Đổi
        </button>
      </div>
    </div>
  </div>
</div>

    <script src="{{ url_for('static', filename='payment_methods.js') }}"></script>
    <script>const SERVER_CONFIG = {{ server_config | tojson | safe }};</script>
    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/account.js') }}"></script>
    <script src="{{ url_for('static', filename='js/market.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ads_core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ads_ui_setup.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ads_management.js') }}"></script>

    <!-- Đã tách file orders.js ra làm 4 files để dễ quản lý -->
    <script src="{{ url_for('static', filename='js/orders_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/orders_list.js') }}"></script>
    <script src="{{ url_for('static', filename='js/orders_ads.js') }}"></script>
    <script src="{{ url_for('static', filename='js/orders_chat.js') }}"></script>
</body>
</html>
